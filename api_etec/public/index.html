<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro Usuários</title>

</head>

<body>

    <div class="container">
        
        <h1 class="title01">Cadastro Usuários</h1>
        <h2 class="title02">Cristian Marcheti & Maria Luiza Bonato</h2>

        <form id="formCadastro" class="form">
            
            <label>Nome</label>
            <input type="text" id="nome" class="input" required>
            
            <label>Idade</label>
            <input type="number" id="idade" class="input" required>

            <label>Email</label>
            <input type="email" id="email" class="input" required>

            <label>Cidade</label>
            <input type="text" id="cidade" class="input" required>

            <button type="submit" class="button">Cadastrar</button>
        
        </form>

    </div>

    <script>

        const formulario = document.getElementById('formCadastro');

        formulario.addEventListener('submit', async (e) => {

            e.preventDefault();

            const usuario = {
                nome: document.getElementById('nome').value,
                idade: document.getElementById('idade').value,
                email: document.getElementById('email').value,
                cidade: document.getElementById('cidade').value
            };

            const resposta = await fetch('/usuarios', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(usuario)
            });

            const dados = await resposta.json();

            alert(dados.mensagem);

            // Limpa o formulário após cadastrar
            formulario.reset();

        });

    </script>

</body>

<style>
    body{
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #d8f6ff;
    }
    label{
        display: block;
        margin-bottom: 5px;
        font-family: Arial, sans-serif;
        font-weight: 700;
    }
    .container{
        justify-content: center;
        align-items: center;
        border: 2px solid #727272;
        background-color: #effbff;
        padding: 35px;
        border-radius: 8px;
    }
    .form{
        width: 320px;
        align-items: center;
        margin: 0 auto;
    }

    .input{
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        box-sizing: border-box;
        background-color: #ffffff;
        border-radius: 15px;
    }

    .button{
        padding: 10px;
        width: 100%;
        cursor: pointer;
        margin-top: 30px;
        background-color: #cdf2ff;
        border: 2px solid #006e6e;
        border-radius: 30px;
    }

    .title01{
        text-align: center;
        margin-bottom: 10px;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .title02{
        text-align: center;
        margin-bottom: 40px;
        font-family:monospace
    }    
    
</style>

</html>
